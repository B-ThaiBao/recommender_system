version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: career_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./services/auth-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/career_app
    depends_on:
      - db

  core-service:
    build: ./services/core-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/career_app
    depends_on:
      - db

  grade-service:
    build: ./services/grade-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    depends_on:
      - db

  chatbot-service:
    build: ./services/chatbot-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8004:8000"

volumes:
  postgres_data:
