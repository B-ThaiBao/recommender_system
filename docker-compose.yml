services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: career_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d career_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build: ./services/auth-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "9001:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/career_app
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-secret}
      PASSWORD_SALT: ${PASSWORD_SALT:-dev-password-salt}
      ACCESS_TOKEN_EXPIRE_SECONDS: ${ACCESS_TOKEN_EXPIRE_SECONDS:-1800}
      REFRESH_TOKEN_EXPIRE_SECONDS: ${REFRESH_TOKEN_EXPIRE_SECONDS:-604800}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  core-service:
    build: ./services/core-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "9002:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/career_app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grade-service:
    build: ./services/grade-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "9003:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chatbot-service:
    build: ./services/chatbot-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "9014:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      PYTHONUNBUFFERED: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_AUTH_API_BASE_URL: http://auth-service:8000
      VITE_CORE_API_BASE_URL: http://core-service:8000
      VITE_GRADE_API_BASE_URL: http://grade-service:8000
      VITE_CHATBOT_API_BASE_URL: http://chatbot-service:8000
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
      grade-service:
        condition: service_healthy
      chatbot-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:

